name: Generate UML Diagrams

on:
  push:
    paths:
      - "**/*.puml"
      - "**/*.uml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Generate UML images
        run: |
          mkdir -p docs/uml
          find uml -type f \( -name "*.puml" -o -name "*.uml" \) -exec plantuml -tpng -d docs/uml {} \;

      - name: Commit generated images
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/uml
          git commit -m "Auto-generate UML diagrams" || echo "No changes to commit"
          git push